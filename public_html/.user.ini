; Event Board — PHP upload/execution limits for this directory.
;
; POST /api/files sends the uploaded file as the raw request body (not a
; multipart form), so post_max_size — not upload_max_filesize — is what
; actually caps upload size here; upload_max_filesize is set to match
; anyway, for anything that might use it in the future. These values give
; ~5MB of headroom over config.php's default MAX_UPLOAD_MB=25 for request
; overhead; raise both together if MAX_UPLOAD_MB is ever raised in
; config.php.
;
; .user.ini (unlike .htaccess php_value, which only works under mod_php and
; is increasingly rare on modern cPanel) works under both PHP-FPM and
; mod_php. Changes can take up to 5 minutes to take effect
; (user_ini.cache_ttl) — don't panic-debug an upload failure immediately
; after editing this file.

upload_max_filesize = 30M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
