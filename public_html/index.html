<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Event Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one working surface. Header with view switch (Events / Tasks / Calendar), a filter row,
   then columns (or a month grid). Any card opens in a right-hand drawer. */
:root{
  --bg:#f2f1f6; --surface:#ffffff; --sunk:#e9e7f0; --ink:#17142a; --muted:#5f5b75; --line:#d9d6e4;
  --accent:#3d2bd6; --accent-ink:#ffffff; --ok:#0e7a57; --warn:#a15c07; --danger:#b42335;
  --me:#fff1d6; --me-ink:#7a4500;
  --s-inquiry:#70748f; --s-hold:#b0720f; --s-offer:#c4470f; --s-confirmed:#bb1b63;
  --s-advancing:#6f35d8; --s-ready:#0e7a6f; --s-settled:#4a5163;
  --shadow:0 1px 2px rgba(23,20,42,.08),0 4px 14px rgba(23,20,42,.06);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121019; --surface:#1c1928; --sunk:#16131f; --ink:#eceaf6; --muted:#a39eba; --line:#302b42;
    --accent:#a595ff; --accent-ink:#15112b; --ok:#4fd1a1; --warn:#f0b454; --danger:#ff8091;
    --me:#3a2c12; --me-ink:#ffcf7a;
    --s-inquiry:#9a9eb8; --s-hold:#f0b454; --s-offer:#ff8f57; --s-confirmed:#ff6fae;
    --s-advancing:#b08cff; --s-ready:#4fd1c0; --s-settled:#8a91a6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1c1928; --sunk:#16131f; --ink:#eceaf6; --muted:#a39eba; --line:#302b42;
  --accent:#a595ff; --accent-ink:#15112b; --ok:#4fd1a1; --warn:#f0b454; --danger:#ff8091;
  --me:#3a2c12; --me-ink:#ffcf7a;
  --s-inquiry:#9a9eb8; --s-hold:#f0b454; --s-offer:#ff8f57; --s-confirmed:#ff6fae;
  --s-advancing:#b08cff; --s-ready:#4fd1c0; --s-settled:#8a91a6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:12px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.brand{font-family:var(--display);font-stretch:118%;font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;margin-right:auto;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-stretch:100%;font-weight:500;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filters .spacer{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.toggle[aria-pressed="true"]{background:var(--me);border-color:var(--me-ink);color:var(--me-ink)}
.btn b{font-family:var(--mono);font-weight:600;margin-left:4px}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:13px}
.note strong{color:var(--ink);font-weight:600}
.note.bad{border-color:var(--danger);border-style:solid}.note.bad strong{color:var(--danger)}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;scroll-snap-align:start;border-top:3px solid var(--c)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h2{gap:8px;margin:0;font-family:var(--display);font-stretch:112%;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;color:var(--c)}
.col h2 .nm{margin-right:auto;overflow-wrap:anywhere;min-width:0}
.col h2 .ct{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0}
.colhint{margin:-4px 0 0;font-size:12px;color:var(--muted)}
.dots{font-size:18px;padding:0 6px;letter-spacing:0}
.colmenu{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.colmenu .mi{text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px;cursor:pointer}
.colmenu .mi:hover{background:var(--sunk)}.colmenu .mi.del{color:var(--danger)}
.colmenu p{margin:4px 4px 6px;font-size:13px}.colmenu .row{display:flex;flex-wrap:wrap;gap:6px;padding:4px}
.rename-in{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:2px;min-width:0}
.col .empty{color:var(--muted);font-size:12px;padding:6px 2px}
.card{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;cursor:pointer;text-align:left;border:1px solid transparent}
.card:hover{border-color:var(--line)}
.card.dragging{opacity:.4}
.card.dropline{box-shadow:0 -3px 0 0 var(--accent),var(--shadow)}
.card.mine{border-color:var(--me-ink)}
.dateblock{font-family:var(--mono);text-align:center;line-height:1.05;min-width:38px;padding-right:10px;border-right:1px dashed var(--line);font-variant-numeric:tabular-nums}
.dateblock .dow,.dateblock .mon{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted)}
.dateblock .day{display:block;font-size:20px;font-weight:600}
.dateblock.tbd .day{font-size:13px;padding-block:6px;color:var(--muted)}
.dateblock.pri .day{color:var(--c,var(--ink))}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.card .meta{margin:2px 0 0;color:var(--muted);font-size:12px}
.meters{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.m{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--muted)}
.m i{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.m u{display:block;height:100%;background:var(--muted)}
.m.full{color:var(--ok)} .m.full u{background:var(--ok)}
.pills{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.me{background:var(--me);color:var(--me-ink);border-color:var(--me-ink)}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.foot .soon{color:var(--warn);font-weight:600}
.tag{font-size:10px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}

/* Calendar */
.calhead{display:flex;align-items:center;gap:8px}
.calhead h2{margin:0;font-family:var(--display);font-stretch:112%;font-weight:700;font-size:18px;min-width:0;margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px}
.grid .dowh{background:var(--sunk);font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);padding:6px 8px}
.day-cell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day-cell.out{background:var(--sunk)}
.daynum{align-self:flex-start;border:0;background:none;font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;border-radius:4px;padding:1px 5px}
.daynum:hover{background:var(--sunk);color:var(--ink)}
.today .daynum{background:var(--accent);color:var(--accent-ink)}
.chip{border:0;border-left:3px solid var(--c);background:var(--sunk);border-radius:4px;padding:3px 6px;font-size:12px;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.chip.task{border-left-style:dashed;background:none;border:1px dashed var(--line);border-left:3px dashed var(--c)}
.chip .rm{font-family:var(--mono);font-size:10px;color:var(--muted);margin-right:5px}
.agenda{display:none;flex-direction:column;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px}
.legend span.dash::before{background:none;border:1px dashed var(--muted)}
@media (max-width:680px){.grid{display:none}.agenda{display:flex}}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dhead .stage-dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.dhead p{margin:0;font-size:12px;color:var(--muted);margin-right:auto;min-width:0}
.dbody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.title-in{width:100%;border:0;border-bottom:2px solid var(--line);background:none;font-family:var(--display);font-stretch:108%;font-weight:800;font-size:24px;padding:2px 0 6px;border-radius:0}
.title-in:focus{outline:none;border-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
.f input,.f select,.f textarea,.add input,.item input[type=text],.sec textarea,.mention input,.prow input,.block input[type=email]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.sec,.block{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.block{padding:12px;display:flex;flex-direction:column;gap:8px}
.bhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bhead strong,.block>strong{font-family:var(--display);font-weight:700;font-size:15px}
.block .row{display:flex;flex-wrap:wrap;gap:6px}
.sec summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 12px}
.sec summary::-webkit-details-marker{display:none}
.sec summary .abbr{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);width:38px}
.sec summary strong{font-family:var(--display);font-weight:700;font-size:15px;margin-right:auto}
.sec summary .count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec.full summary .count{color:var(--ok)}
.sec summary::after{content:"+";font-family:var(--mono);color:var(--muted);width:10px;text-align:center}
.sec[open] summary::after{content:"\2212"}
.secbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px}
.item input[type=checkbox],.wait input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--ok)}
.item input[type=text]{border-color:transparent;padding:5px 6px}
.item input[type=text]:hover,.item input[type=text]:focus{border-color:var(--line)}
.item.done input[type=text]{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:4px;padding:2px 7px;font-size:16px;line-height:1}
.x:hover{color:var(--danger);background:var(--sunk)}
.add{display:flex;gap:8px}
.sublabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.wait{display:flex;align-items:flex-start;gap:8px;padding:6px;border-radius:6px}
.wait.mine{background:var(--me)}
.wait .wtxt{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.wait .em{font-weight:600;color:var(--accent)}
.wait.mine .em{color:var(--me-ink)}
.wait small{color:var(--muted);font-size:11.5px}
.wait.done .wtxt{color:var(--muted);text-decoration:line-through}
.mention{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:5;display:flex;flex-direction:column;max-height:260px;overflow-y:auto}
.sugg[hidden]{display:none}
.sugg button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.sugg button:hover,.sugg button:focus{background:var(--sunk)}
.sugg small,.sugg .none{color:var(--muted);font-size:12px}
.sugg .none{padding:6px 8px}
.lrow{display:flex;align-items:center;gap:4px}
.lnk{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:baseline;text-align:left;border:1px solid var(--line);border-left:3px solid var(--c);background:var(--bg);border-radius:6px;padding:6px 8px;cursor:pointer}
.lnk:hover{border-color:var(--muted)}
.lnk .lt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lnk small{grid-column:2;color:var(--muted);font-size:12px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;min-width:0}
.file img,.file .ico{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:var(--sunk);border:1px solid var(--line)}
.file .ico{display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.file a{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.file small{color:var(--muted);white-space:nowrap}
.uprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.uprow select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.hint{font-size:12px;color:var(--muted);margin:0}
.prow{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:6px;align-items:center}
@media (max-width:520px){.prow{grid-template-columns:1fr 1fr auto}.prow .role{grid-column:1/3}}
.dfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;padding-top:4px}
.authbox{max-width:400px;width:100%;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.authbox h2{margin:0;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:22px}
.authbox label.f input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.err{color:var(--danger);margin:0;font-size:13px}
body.auth .top .seg,body.auth #new-card,body.auth #filters,body.auth #notes{display:none}
.urow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.urow .wtxt{flex:1;min-width:160px;display:flex;flex-direction:column;overflow-wrap:anywhere}
.urow small{color:var(--muted);font-size:12px}
.urow select,.urow input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:30;font-size:13px;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Event Board<small>Events and crew tasks across Reelworks, Tracks, Lounge and Basement</small></h1>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="events" aria-pressed="true">Events</button>
      <button type="button" data-view="tasks" aria-pressed="false">Tasks</button>
      <button type="button" data-view="cal" aria-pressed="false">Calendar</button>
    </div>
    <button type="button" class="btn primary" id="new-card">+ New event</button>
  </header>
  <div class="filters" id="filters"></div>
  <div id="notes"></div>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ---------- fixed setup ---------- */
const PALETTE=['inquiry','hold','offer','confirmed','advancing','ready','settled'];
let STAGES=[
  {id:'inquiry',name:'Inquiry'},{id:'hold',name:'Hold'},{id:'offer',name:'Offer out'},
  {id:'confirmed',name:'Confirmed'},{id:'advancing',name:'Advancing'},{id:'ready',name:'Show ready'},{id:'settled',name:'Settled'}].map(x=>Object.assign({c:x.id},x));
const stageOf=id=>STAGES.find(x=>x.id===id)||STAGES[0];
const sc=id=>`var(--s-${stageOf(id).c||'inquiry'})`;
const TCOLS=[
  {id:'backlog',name:'Backlog',c:'var(--s-settled)',hint:'Parked. Not scheduled yet.'},
  {id:'todo',name:'Up next',c:'var(--accent)',ranked:true,hint:'In priority order. #1 is most urgent.'},
  {id:'doing',name:'In progress',c:'var(--s-advancing)',ranked:true},
  {id:'done',name:'Done',c:'var(--ok)'}];
const tcol=id=>TCOLS.find(x=>x.id===id)||TCOLS[0];
const SECTIONS=[
  {id:'lighting',name:'Lighting',abbr:'LX',items:['Lighting plot received','House rig covers the plot','Extra fixtures or haze arranged','Operator confirmed (touring LD or house)']},
  {id:'audio',name:'Audio',abbr:'AUD',items:['Input list received','Console and mic requests met','Monitor mixes confirmed','FOH engineer confirmed']},
  {id:'staging',name:'Staging',abbr:'STG',items:['Stage plot received','Risers and backline arranged','Load-in time confirmed','Power requirements met']},
  {id:'deco',name:'Deco',abbr:'DECO',items:['Look agreed with promoter','Materials sourced','Install scheduled','Strike plan set']},
  {id:'rider',name:'Rider verification',abbr:'RDR',items:['Rider received','Hospitality reviewed','Tech rider checked against house specs','Conflicts sent to agent','Signed off by both sides']}];
const FILE_TAGS=['General','Lighting','Audio','Staging','Deco','Rider','Fabrication'];
const TYPES={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',txt:'text/plain',csv:'text/csv',md:'text/markdown',mp4:'video/mp4'};
const ROOMS=[{id:'Reelworks',ab:'RW'},{id:'Tracks',ab:'TR'},{id:'Lounge',ab:'LG'},{id:'Basement',ab:'BS'}];
const roomAb=r=>{const x=ROOMS.find(y=>y.id===r);return x?x.ab:'--'};
const FIRM=['confirmed','advancing','ready'];
const HOLDS={1:'1st hold',2:'2nd hold',3:'3rd hold'};

function blankSections(){const o={};SECTIONS.forEach(s=>o[s.id]={notes:'',items:s.items.map(t=>({t,d:false}))});return o}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4200)}
function parseDate(s){if(!s)return null;const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtTime(t){if(!t)return '';const p=t.split(':').map(Number);const h=p[0]%12||12;return h+':'+String(p[1]).padStart(2,'0')+(p[0]<12?' AM':' PM')}
function fmtDate(s){const d=parseDate(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}
function daysTo(s){const d=parseDate(s);if(!d)return null;const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((d-t)/864e5)}
function prog(s,id){const it=(s.sections&&s.sections[id]&&s.sections[id].items)||[];return {done:it.filter(i=>i.d).length,total:it.length}}
function listOf(c,sec){return sec==='__steps'?c.items:c.sections[sec].items}
function normalize(k,c){
  c.title=c.title||'';c.notes=c.notes||'';c.room=c.room||'';
  c.files=Array.isArray(c.files)?c.files:[];c.links=Array.isArray(c.links)?c.links:[];
  c.waiting=Array.isArray(c.waiting)?c.waiting.filter(w=>w&&w.email):[];
  if(k==='task'){c.items=Array.isArray(c.items)?c.items:[];if(!TCOLS.some(x=>x.id===c.col))c.col='backlog';
    c.rank=typeof c.rank==='number'?c.rank:0;c.assignee=String(c.assignee||'').toLowerCase();c.due=c.due||'';c.created=c.created||0}
  else{c.sections=c.sections||{};SECTIONS.forEach(x=>{const s=c.sections[x.id]=c.sections[x.id]||{};s.notes=s.notes||'';s.items=Array.isArray(s.items)?s.items:[]})}
  return c}
const openWaits=c=>c.waiting.filter(w=>!w.done);
const waitsMe=c=>!!myEmail&&openWaits(c).some(w=>w.email===myEmail);
const liveLinks=c=>c.links.filter(id=>find(id));
function people(){const out=team.map(p=>({email:p.email,name:p.name||p.email,role:p.role||''}));
  users.forEach(u=>{if(!out.some(p=>p.email===u.email))out.push({email:u.email,name:u.name||u.email,role:'Login'})});return out}
function personName(email){const p=people().find(x=>x.email===email);return p&&p.name?p.name:email}
function knownPeople(){const m=new Map();people().forEach(p=>p.email&&m.set(p.email,p.name||''));
  for(const c of [...shows.values(),...tasks.values()])c.waiting.forEach(w=>{if(!m.has(w.email))m.set(w.email,'')});
  return [...m].map(([email,name])=>({email,name}))}

/* ---------- saving ---------- */
const key=(k,id)=>k+':'+id;
function save(k,id){if(!db)return;const kk=key(k,id);dirty.add(kk);clearTimeout(timers[kk]);timers[kk]=setTimeout(()=>flush(k,id),500)}
async function flush(k,id){
  const kk=key(k,id);if(writing[kk]){again[kk]=true;return}
  writing[kk]=true;const c=mapOf(k).get(id);
  try{if(c){const body=JSON.parse(JSON.stringify(c));delete body.id;await db.doc((k==='task'?'tasks/':'shows/')+id).set(body)}}
  catch(e){if(e&&e.status===401)return;toast(e&&e.status&&e.status!==500?e.message:'Could not save that change. Check your connection and try again.')}
  writing[kk]=false;if(again[kk]){again[kk]=false;flush(k,id)}else dirty.delete(kk);
}
function saveCfg(path,body){if(!db)return;cfgChain=cfgChain.then(()=>db.doc(path).set(body)).catch(()=>toast('Could not save that setting.'))}
function saveStages(){saveCfg('config/board',{stages:JSON.parse(JSON.stringify(STAGES))})}
function saveTeam(now){if(!db)return;teamDirty=true;clearTimeout(teamTimer);
  teamTimer=setTimeout(()=>{saveCfg('config/team',{people:JSON.parse(JSON.stringify(team))});cfgChain.then(()=>teamDirty=false)},now?0:600)}
async function removeCard(k,id){
  const c=mapOf(k).get(id);if(!c)return;
  for(const o of c.links){const r=find(o);if(r){r.c.links=r.c.links.filter(x=>x!==id);save(r.k,o)}}
  mapOf(k).delete(id);const kk=key(k,id);clearTimeout(timers[kk]);dirty.delete(kk);
  if(db){try{await db.doc((k==='task'?'tasks/':'shows/')+id).delete()}catch(e){toast('Could not delete that card.')}
    if(assets)for(const f of c.files){try{await assets.delete(f.id)}catch(e){}}}
}
function addLink(a,b){const A=find(a),B=find(b);if(!A||!B||a===b)return;
  if(!A.c.links.includes(b)){A.c.links.push(b);save(A.k,a)}if(!B.c.links.includes(a)){B.c.links.push(a);save(B.k,b)}}
function removeLink(a,b){const A=find(a),B=find(b);
  if(A){A.c.links=A.c.links.filter(x=>x!==b);save(A.k,a)}if(B){B.c.links=B.c.links.filter(x=>x!==a);save(B.k,b)}}

/* ---------- task priority ---------- */
const byRank=(a,b)=>(a.rank-b.rank)||((a.created||0)-(b.created||0));
function colTasks(col,exceptId){const l=[...tasks.values()].filter(t=>t.col===col&&t.id!==exceptId);
  return col==='done'?l.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)):l.sort(byRank)}
function placeTask(t,col,index){
  const list=colTasks(col,t.id);index=Math.max(0,Math.min(index,list.length));
  const prev=list[index-1],next=list[index];
  t.rank=prev&&next?(prev.rank+next.rank)/2:prev?prev.rank+1:next?next.rank-1:0;
  if(col==='done'&&t.col!=='done')t.doneAt=Date.now();
  t.col=col;save('task',t.id);
}

/* ---------- filters ---------- */
function visibleShows(){return [...shows.values()].filter(s=>(roomFilter==='all'||s.room===roomFilter)&&(!waitMine||waitsMe(s)))}
function visibleTasks(){return [...tasks.values()].filter(t=>(personFilter==='all'||t.assignee===personFilter)&&(!waitMine||waitsMe(t)))}
function others(s){return s.date&&s.room?[...shows.values()].filter(o=>o.id!==s.id&&o.date===s.date&&o.room===s.room&&o.stage!=='settled'):[]}
function clash(s){return FIRM.includes(s.stage)&&others(s).some(o=>FIRM.includes(o.stage))}
const sortByDate=list=>list.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||String(a.title).localeCompare(String(b.title)));

/* ---------- cards ---------- */
function pills(c){const w=openWaits(c);if(!w.length)return '';const me=waitsMe(c);
  return `<div class="pills"><span class="pill${me?' me':''}">${me?'Waiting on you':'Waiting on '+w.length+(w.length===1?' person':' people')}</span></div>`}
function extras(c){const p=[];const nf=c.files.length,nl=liveLinks(c).length;
  if(nf)p.push(nf+(nf===1?' file':' files'));if(nl)p.push(nl+(nl===1?' link':' links'));return p.join(' · ')}
function eventCard(s,drag){
  const d=parseDate(s.date),n=daysTo(s.date);
  const dateb=d?`<div class="dateblock"><span class="dow">${d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}</span><span class="day">${d.getDate()}</span><span class="mon">${d.toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</span></div>`
               :`<div class="dateblock tbd"><span class="day">TBD</span></div>`;
  const meta=[s.room||'Room not set',s.doors?'Doors '+fmtTime(s.doors):'',s.stage==='hold'?HOLDS[s.hold]||'':''].filter(Boolean).join(' · ');
  const meters=SECTIONS.map(x=>{const p=prog(s,x.id);const w=p.total?Math.round(p.done/p.total*100):0;
    return `<span class="m${p.total&&p.done===p.total?' full':''}" title="${esc(x.name)}: ${p.done} of ${p.total}">${x.abbr}<i><u style="width:${w}%"></u></i></span>`}).join('');
  let when='';if(n!==null&&s.stage!=='settled'){when=n<0?`${-n}d ago`:n===0?'Tonight':n===1?'Tomorrow':`In ${n} days`}
  const soon=n!==null&&n>=0&&n<=7&&s.stage!=='ready'&&s.stage!=='settled';
  return `<article class="card${waitsMe(s)?' mine':''}" tabindex="0" role="button" ${drag?'draggable="true"':''} data-k="show" data-id="${esc(s.id)}" aria-label="Open ${esc(s.title||'Untitled event')}">
    ${dateb}<div><h3>${esc(s.title||'Untitled event')}</h3><p class="meta">${esc(meta)}</p></div>
    <div class="meters">${meters}</div>${pills(s)}
    <div class="foot"><span>${extras(s)||'No files'}${s.example?' · <span class="tag">Example</span>':''}</span><span class="${soon||clash(s)?'soon':''}">${clash(s)?'Double-booked':when}</span></div>
  </article>`;
}
function taskCard(t,n,drag){
  const col=tcol(t.col);
  const pri=t.col==='done'?'<span class="mon">DONE</span><span class="day">&#10003;</span>':n?`<span class="mon">PRI</span><span class="day">${n}</span>`:'<span class="mon">LATER</span><span class="day">&ndash;</span>';
  const due=t.due?daysTo(t.due):null;
  const dueTxt=!t.due?'':t.col==='done'?fmtDate(t.due):due<0?`Overdue ${-due}d`:due===0?'Due today':due===1?'Due tomorrow':'Due '+fmtDate(t.due);
  const late=t.due&&t.col!=='done'&&t.col!=='backlog'&&due<=1;
  const steps=t.items.length?t.items.filter(i=>i.d).length+'/'+t.items.length+' steps':'';
  const meta=[t.assignee?personName(t.assignee):'Unassigned',t.room].filter(Boolean).join(' · ');
  const left=[steps,extras(t)].filter(Boolean).join(' · ');
  return `<article class="card${waitsMe(t)?' mine':''}" tabindex="0" role="button" ${drag?'draggable="true"':''} data-k="task" data-id="${esc(t.id)}" aria-label="Open task ${esc(t.title||'Untitled task')}">
    <div class="dateblock pri" style="--c:${col.c}">${pri}</div><div><h3>${esc(t.title||'Untitled task')}</h3><p class="meta">${esc(meta)}</p></div>${pills(t)}
    <div class="foot"><span>${left||'No steps yet'}${t.example?' · <span class="tag">Example</span>':''}</span><span class="${late?'soon':''}">${esc(dueTxt)}</span></div>
  </article>`;
}

  if(menuMode==='remove'){const to=STAGES[i>0?i-1:1];return `<div class="colmenu"><p>Remove "${esc(st.name)}"?${n?` Its ${n} ${n===1?'event moves':'events move'} to "${esc(to.name)}".`:''}</p><div class="row"><button type="button" class="btn small danger" data-act="col-remove-yes">Remove column</button><button type="button" class="btn small" data-act="col-cancel">Keep it</button></div></div>`}

function renderNotes(){
  const el=$('#notes');const ex=[...shows.values(),...tasks.values()].filter(s=>s.example).length+team.filter(p=>p.example).length;let h='';
  if(mode==='down')h+=`<div class="note bad"><strong>Can't reach the board server.</strong> Check that it is running, then reload this page.</div>`;
  else if(offline)h+=`<div class="note"><strong>Reconnecting…</strong> Changes made by others will appear once the connection is back.</div>`;
  else if(mode==='loading')h+=`<div class="note">Loading the board…</div>`;
  else if(mode==='slow')h+=`<div class="note">Can't reach the saved board yet. Still trying.</div>`;
  else if(view==='tasks'&&!tasks.size)h+=`<div class="note"><strong>No tasks yet.</strong> Add your crew under Team, then add a task. Or load example tasks to try it out. <button type="button" class="btn small" data-act="load-examples">Load examples</button></div>`;
  else if(view!=='tasks'&&!shows.size)h+=`<div class="note"><strong>No events on the board yet.</strong> Add your first event, or load examples to try it out. <button type="button" class="btn small" data-act="load-examples">Load examples</button></div>`;

function renderMain(){
  renderFilters();renderNotes();
  const main=$('#main');
  if(view==='events'){
    const all=visibleShows();
    main.innerHTML=`<div class="board">`+STAGES.map(st=>{
      const list=sortByDate(all.filter(s=>stageOf(s.stage).id===st.id));
      return `<section class="col" data-stage="${st.id}" style="--c:${sc(st.id)}"><h2><span class="nm">${esc(st.name)}</span><span class="ct">${list.length}</span><button type="button" class="x dots" data-act="col-menu" data-stage="${st.id}" aria-label="Options for ${esc(st.name)} column" aria-expanded="${menuFor===st.id}">&#8943;</button></h2>${menuFor===st.id?colMenu(st,list.length):''}${list.map(s=>eventCard(s,true)).join('')||'<div class="empty">Drop an event here</div>'}</section>`}).join('')+`</div>`;
  }else if(view==='tasks'){
    const all=visibleTasks();
    main.innerHTML=`<div class="board">`+TCOLS.map(col=>{
      const list=all.filter(t=>t.col===col.id);
      if(col.id==='done')list.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));else list.sort(byRank);
      return `<section class="col" data-tcol="${col.id}" style="--c:${col.c}"><h2><span class="nm">${col.name}</span><span class="ct">${list.length}</span></h2>${col.hint?`<p class="colhint">${col.hint}</p>`:''}${list.map((t,i)=>taskCard(t,col.ranked?i+1:null,true)).join('')||'<div class="empty">Drop a task here</div>'}</section>`}).join('')+`</div>`;
  }else{
    const first=new Date(calY,calM,1),start=new Date(calY,calM,1-first.getDay());
    const evs=visibleShows().filter(s=>s.date);
    const tks=[...tasks.values()].filter(t=>t.due&&t.col!=='done'&&(roomFilter==='all'||t.room===roomFilter)&&(!waitMine||waitsMe(t)));
    const byDate={};evs.forEach(s=>(byDate[s.date]=byDate[s.date]||{e:[],t:[]}).e.push(s));tks.forEach(t=>(byDate[t.due]=byDate[t.due]||{e:[],t:[]}).t.push(t));
    let cells='';const today=iso(now);
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
      if(i>=35&&d.getMonth()!==calM&&i%7===0)break;
      const b=byDate[k]||{e:[],t:[]};
      cells+=`<div class="day-cell${d.getMonth()!==calM?' out':''}${k===today?' today':''}"><button type="button" class="daynum" data-newdate="${k}" title="Add an event on this date">${d.getDate()}</button>${
        sortByDate(b.e).map(s=>`<button type="button" class="chip" data-k="show" data-id="${esc(s.id)}" style="--c:${sc(s.stage)}" title="${esc(s.title)} · ${esc(s.room||'Room not set')} · ${esc(stageOf(s.stage).name)}"><span class="rm">${roomAb(s.room)}</span>${esc(s.title||'Untitled event')}</button>`).join('')}${
        b.t.map(t=>`<button type="button" class="chip task" data-k="task" data-id="${esc(t.id)}" style="--c:${tcol(t.col).c}" title="Task due: ${esc(t.title)} · ${esc(t.assignee?personName(t.assignee):'Unassigned')}"><span class="rm">TASK</span>${esc(t.title||'Untitled task')}</button>`).join('')}</div>`}
    const inM=s=>{const d=parseDate(s);return d&&d.getFullYear()===calY&&d.getMonth()===calM};
    const agenda=[...evs.filter(s=>inM(s.date)).map(s=>({d:s.date,h:eventCard(s,false)})),...tks.filter(t=>inM(t.due)).map(t=>({d:t.due,h:taskCard(t,null,false)}))].sort((a,b)=>a.d.localeCompare(b.d));
    main.innerHTML=`<div class="calhead"><h2>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2>
      <button type="button" class="btn small" data-act="cal-prev" aria-label="Previous month">&larr;</button>
      <button type="button" class="btn small" data-act="cal-today">Today</button>
      <button type="button" class="btn small" data-act="cal-next" aria-label="Next month">&rarr;</button></div>
      <div class="legend" style="margin:10px 0">${STAGES.map(s=>`<span style="--c:${sc(s.id)}">${esc(s.name)}</span>`).join('')}<span class="dash">Task due date</span></div>
      <div class="grid">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d=>`<div class="dowh">${d}</div>`).join('')}${cells}</div>
      <div class="agenda">${agenda.map(x=>x.h).join('')||'<div class="note">Nothing dated this month.</div>'}</div>`;
  }
}

function syncHash(){const want=open&&open.k!=='team'?'#card-'+encodeURIComponent(open.id):'';if(location.hash!==want){try{history.replaceState(null,'',want||location.pathname+location.search)}catch(e){}}}

function linkCandidates(q){

  const all=[...[...shows.values()].map(x=>({k:'show',id:x.id,c:x,d:x.date||''})),...[...tasks.values()].map(x=>({k:'task',id:x.id,c:x,d:x.due||''}))].filter(r=>r.id!==open.id&&!c.links.includes(r.id));

  if(!q)return all.filter(r=>r.k==='show'&&r.d&&r.d<t).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,6);
  return all.filter(r=>[r.c.title,r.c.room,r.c.contact,r.k==='task'?personName(r.c.assignee):''].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,8);

const API={async req(method,url,body,headers){
  const isBlob=typeof Blob!=='undefined'&&body instanceof Blob;
  const hd=Object.assign({'x-requested-with':'eventboard'},body!==undefined&&!isBlob?{'content-type':'application/json'}:{},headers||{});
  let r;
  try{r=await fetch(url,{method,headers:hd,credentials:'same-origin',body:body===undefined?undefined:isBlob?body:JSON.stringify(body)})}
  catch(e){throw Object.assign(new Error("Can't reach the board server."),{status:0,code:'unavailable'})}
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&me&&j&&j.code==='signed_out')signedOut();
  if(!r.ok)throw Object.assign(new Error((j&&j.error)||('Request failed ('+r.status+')')),{status:r.status,code:(j&&j.code)||'error'});
  return j||{};
}};

/* A small store with the same shape the page already uses: doc(path).set/delete/onSnapshot, collection(name).onSnapshot */
function makeDb(initial){
  const cols={shows:new Map(),tasks:new Map(),config:new Map()};
  const load=docs=>{for(const c in cols){cols[c].clear();const src=(docs&&docs[c])||{};for(const id in src)cols[c].set(id,src[id])}};
  load(initial);
  const colL={},docL={};
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=(id,d)=>d?{id,exists:true,data:()=>d,metadata:meta}:{id,exists:false,data:()=>undefined,metadata:meta};
  const fireCol=c=>(colL[c]||[]).forEach(n=>{const docs=[...cols[c]].map(([id,d])=>snap(id,d));n({docs,size:docs.length,empty:!docs.length,metadata:meta})});
  const fireDoc=(c,id)=>(docL[c+'/'+id]||[]).forEach(n=>n(snap(id,cols[c].get(id))));
  const url=(c,id)=>'/api/docs/'+c+'/'+encodeURIComponent(id);
  return {
    apply(c,id,data){if(!cols[c])return;if(data===null)cols[c].delete(id);else cols[c].set(id,data);fireCol(c);fireDoc(c,id)},
    replaceAll(docs){load(docs);Object.keys(cols).forEach(fireCol);Object.keys(docL).forEach(k=>{const [c,id]=k.split('/');fireDoc(c,id)})},
    doc(p){const [c,id]=p.split('/');return {
      async set(d){await API.req("PUT",url(c,id),d)},
      async delete(){await API.req('DELETE',url(c,id))},
      onSnapshot(next){const k=c+'/'+id;(docL[k]=docL[k]||[]).push(next);setTimeout(()=>next(snap(id,cols[c].get(id))));return ()=>{}}}},
    collection(c){return {onSnapshot(next){(colL[c]=colL[c]||[]).push(next);setTimeout(()=>fireCol(c));return ()=>{}}}}
  };
}

  upload:(file,o)=>API.req('POST','/api/files',file,{'content-type':o.type,'x-filename':encodeURIComponent(file.name)}),

/* Polling replacement for the old EventSource('/api/events'): hits GET /api/changes?since=<cursor>
   every ~3s. `cursor` seeds from /api/state's own cursor field (see the caller below), and each
   response's `cursor` (a seq value, not a timestamp — see docs/PHP_REWRITE_PLAN.md) becomes the next
   poll's `since`. Each returned doc is fed into db.apply(col,id,data) exactly like the SSE handler
   did (data is already null for a deleted doc, so no separate "deleted" flag is needed here). */
function connectLive(cursor){
  pollCursor=cursor||0;usersSnapshot=JSON.stringify(users);
  pollTick();
}
async function pollTick(){
  try{
    const r=await API.req('GET','/api/changes?since='+encodeURIComponent(pollCursor));
    clearTimeout(offTimer);if(offline){offline=false;renderNotes()}
    mode='live';pollCursor=r.cursor;
    (r.docs||[]).forEach(d=>db.apply(d.col,d.id,d.data));
    const nu=JSON.stringify(r.users||[]);
    if(nu!==usersSnapshot){usersSnapshot=nu;users=r.users||[];const mine=users.find(u=>u.id===me.id);if(mine)Object.assign(me,mine);refresh()}
  }catch(e){
    if(e&&e.status===401)return;
    clearTimeout(offTimer);offTimer=setTimeout(()=>{offline=true;renderNotes();fetch('/api/status',{credentials:'same-origin'}).then(r=>r.json()).then(s=>{if(!s.user)signedOut()}).catch(()=>{})},5000);
  }
  pollTimer=setTimeout(pollTick,3000);
}

  $('#auth-form').addEventListener('submit',async e=>{e.preventDefault();const err=$('#a-err');err.hidden=true;
    const body={email:$('#a-email').value,password:$('#a-pass').value};if(setup)body.name=$('#a-name').value;
    try{await API.req('POST',setup?'/api/setup':'/api/login',body);location.reload()}catch(x){err.textContent=x.message;err.hidden=false}});
  const f=$(setup?'#a-name':'#a-email');if(f)f.focus();
}
function refresh(){if(menuMode!=='rename')renderMain();
  if(open){if(open.k!=='team'&&!mapOf(open.k).has(open.id)){open=null;back=[];renderDrawer()}else if(!$('#overlay').contains(document.activeElement))renderDrawer()}}
{const v=lsGet('eb-view');if(['events','tasks','cal'].includes(v))view=v}
renderMain();
(async()=>{
  let st;
  try{st=await API.req('GET','/api/status')}catch(e){mode='down';return renderMain()}
  if(st.setup)return showAuth('setup');
  if(!st.user)return showAuth('login');
  me=st.user;mailOn=!!st.mail;myEmail=me.email;emailDetected=true;
  let s;try{s=await API.req('GET','/api/state')}catch(e){mode='down';return renderMain()}
  users=s.users||[];db=makeDb(s.docs);assets=makeAssets();
  const sub=(colName,k,map)=>db.collection(colName).onSnapshot(snap=>{
    if(k==='show')mode='live';
    const seen=new Set();
    snap.docs.forEach(d=>{seen.add(d.id);if(!dirty.has(key(k,d.id))){const c=JSON.parse(JSON.stringify(d.data()));c.id=d.id;map.set(d.id,normalize(k,c))}});
    for(const id of [...map.keys()])if(!seen.has(id)&&!dirty.has(key(k,id)))map.delete(id);
    refresh();
  });
  sub('shows','show',shows);sub('tasks','task',tasks);
  db.doc('config/board').onSnapshot(snap=>{
    const d=snap.exists&&snap.data();if(!d||!Array.isArray(d.stages)||!d.stages.length||menuMode==='rename')return;
    const st2=JSON.parse(JSON.stringify(d.stages)).filter(x=>x&&x.id&&x.name);if(!st2.length)return;STAGES=st2;
    if(menuFor&&!STAGES.some(x=>x.id===menuFor)){menuFor=null;menuMode=null}refresh();
  });
  db.doc('config/team').onSnapshot(snap=>{
    if(teamDirty)return;const d=snap.exists&&snap.data();team=d&&Array.isArray(d.people)?JSON.parse(JSON.stringify(d.people)).filter(p=>p&&p.email):[];refresh();
  });
  setTimeout(openFromHash,0);
  window.addEventListener('hashchange',openFromHash);
  connectLive(s.cursor);
})();
</script>
